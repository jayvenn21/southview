<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>South View Cemetery — Notable Figures</title>
  <link rel="icon" href="cemelogo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: "Source Serif 4", Georgia, serif; background: #fff; color: #1a1a1a; }
    .app { display: flex; height: 100vh; width: 100%; }

    .sidebar {
      width: 360px; min-width: 300px; background: #fff;
      border-right: 1px solid #e8e4df;
      display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
    }
    .sidebar-header {
      padding: 20px 24px 16px; border-bottom: 1px solid #e8e4df;
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .site-logo { height: 40px; width: auto; display: block; }
    .sidebar-body { flex: 1; overflow-y: auto; padding: 14px 18px 18px; }

    .section-title {
      font-size: 11px; font-weight: 700; color: #6b5d4a;
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 12px;
    }

    .figure-list { display: flex; flex-direction: column; gap: 6px; }
    .figure-card {
      padding: 12px 14px; background: #faf9f7; border-radius: 10px;
      cursor: pointer; border: 2px solid transparent;
      transition: border-color 0.15s, background 0.15s;
    }
    .figure-card:hover { background: #f5f0e8; border-color: #e8e4df; }
    .figure-card.active { border-color: #b76e79; background: #fdf6f0; }
    .figure-card .fc-name { font-size: 14px; font-weight: 700; color: #1a1a1a; margin-bottom: 2px; }
    .figure-card .fc-role { font-size: 11px; color: #b76e79; font-weight: 600; }

    .detail-panel { display: none; flex-direction: column; gap: 12px; }
    .detail-panel.visible { display: flex; }
    .detail-back {
      background: none; border: none; color: #b76e79; font-size: 13px;
      font-family: "Source Serif 4", Georgia, serif; font-weight: 600;
      cursor: pointer; padding: 0; text-align: left;
    }
    .detail-back:hover { text-decoration: underline; }
    .detail-name { font-size: 24px; font-weight: 700; line-height: 1.3; }
    .detail-dates { font-size: 14px; color: #6b5d4a; margin-bottom: 4px; }
    .detail-role { font-size: 13px; color: #b76e79; font-weight: 600; margin-bottom: 8px; }
    .detail-summary { font-size: 14px; line-height: 1.7; color: #444; margin-bottom: 12px; }
    .detail-facts-title {
      font-size: 11px; font-weight: 700; color: #6b5d4a;
      text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px;
    }
    .detail-facts { margin: 0; padding-left: 18px; }
    .detail-facts li { font-size: 13px; line-height: 1.7; color: #333; margin-bottom: 6px; }
    .detail-directions {
      display: inline-block; margin-top: 12px; padding: 10px 18px;
      font-size: 13px; font-family: "Source Serif 4", Georgia, serif;
      background: #1a1a1a; color: #fff; border-radius: 10px;
      font-weight: 600; text-decoration: none;
    }
    .detail-directions:hover { background: #333; }

    .map-wrap { flex: 1; position: relative; min-width: 0; }
    #map { position: absolute; inset: 0; min-height: 400px; }

    .map-actions {
      position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
      z-index: 2; display: flex; align-items: center; gap: 14px;
    }
    .map-actions button {
      padding: 10px 20px; font-size: 14px;
      font-family: "Source Serif 4", Georgia, serif; font-weight: 600;
      border: none; border-radius: 12px; cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-reset { background: #fff; color: #1a1a1a; border: 1px solid #e8e4df !important; }
    .btn-reset:hover { background: #f5f0e8; }
    .btn-tour { background: #1a1a1a; color: #fff; }
    .btn-tour:hover { background: #333; }

    .tour-controls {
      position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
      z-index: 2; display: none; align-items: center; gap: 12px;
      background: #1a1a1a; color: #fff; padding: 12px 20px; border-radius: 14px;
    }
    .tour-controls.visible { display: flex; }
    .tour-controls button {
      background: #fff; color: #1a1a1a; border: none; border-radius: 8px;
      padding: 6px 14px; font-size: 13px; font-family: "Source Serif 4", Georgia, serif;
      font-weight: 600; cursor: pointer;
    }
    .tour-step-text { font-size: 13px; font-weight: 600; min-width: 60px; text-align: center; }

    .figure-marker {
      width: 32px; height: 32px; background: #b76e79; border: 3px solid #fff;
      border-radius: 50%; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      transition: transform 0.2s;
    }
    .figure-marker:hover { transform: scale(1.2); }
    .figure-marker.active {
      background: #C19A6B; border-color: #fff; transform: scale(1.3);
      box-shadow: 0 0 0 6px rgba(193,154,107,0.3), 0 2px 8px rgba(0,0,0,0.25);
    }

    .mapboxgl-popup-content {
      padding: 14px 16px; min-width: 200px; border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12); border: 1px solid #e8e4df;
      font-family: "Source Serif 4", Georgia, serif;
    }
    .popup-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .popup-role { font-size: 12px; color: #b76e79; font-weight: 600; margin-bottom: 6px; }
    .popup-summary { font-size: 12px; color: #555; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="cemelogo.png" alt="South View Cemetery" class="site-logo">
      </div>
      <div class="sidebar-body">
        <div id="list-view">
          <div class="section-title">Notable Figures at South-View</div>
          <div class="figure-list" id="figure-list"></div>
        </div>
        <div class="detail-panel" id="detail-panel">
          <button type="button" class="detail-back" id="detail-back">← All figures</button>
          <div class="detail-name" id="detail-name"></div>
          <div class="detail-dates" id="detail-dates"></div>
          <div class="detail-role" id="detail-role"></div>
          <div class="detail-summary" id="detail-summary"></div>
          <div class="detail-facts-title">Key Facts</div>
          <ul class="detail-facts" id="detail-facts"></ul>
          <a id="detail-directions" href="#" target="_blank" rel="noopener" class="detail-directions">Get Directions</a>
        </div>
      </div>
    </aside>
    <div class="map-wrap">
      <div id="map"></div>
      <div class="map-actions" id="map-actions">
        <button type="button" class="btn-reset" id="reset-map">Reset map</button>
        <button type="button" class="btn-tour" id="start-tour">Start Guided Tour</button>
      </div>
      <div class="tour-controls" id="tour-controls">
        <button type="button" id="tour-prev">← Prev</button>
        <span id="tour-step" class="tour-step-text">1 / 13</span>
        <button type="button" id="tour-next">Next →</button>
        <button type="button" id="tour-exit">Exit Tour</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    mapboxgl.accessToken = typeof MAPBOX_ACCESS_TOKEN !== 'undefined' ? MAPBOX_ACCESS_TOKEN : '';

    const FIGURES_URL = 'data/notable-figures.json';
    const INITIAL_CENTER = [-84.3900, 33.7450];
    const INITIAL_ZOOM = 12.5;

    let figures = [];
    let markers = [];
    let selectedFigure = null;
    let tourActive = false;
    let tourStep = 0;
    let popupInstance = null;

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12',
      center: INITIAL_CENTER,
      zoom: INITIAL_ZOOM,
      minZoom: 10,
      maxZoom: 19
    });

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function selectFigure(fig) {
      selectedFigure = fig;
      const listView = document.getElementById('list-view');
      const detailPanel = document.getElementById('detail-panel');

      markers.forEach(m => m.el.classList.remove('active'));
      document.querySelectorAll('.figure-card').forEach(c => c.classList.remove('active'));

      if (!fig) {
        listView.style.display = '';
        detailPanel.classList.remove('visible');
        return;
      }

      listView.style.display = 'none';
      detailPanel.classList.add('visible');

      document.getElementById('detail-name').textContent = fig.name;
      document.getElementById('detail-dates').textContent = fig.dates || '';
      document.getElementById('detail-role').textContent = fig.role;
      document.getElementById('detail-summary').textContent = fig.summary;
      document.getElementById('detail-facts').innerHTML = fig.facts.map(f => `<li>${escapeHtml(f)}</li>`).join('');

      const dirLink = document.getElementById('detail-directions');
      dirLink.href = `https://www.google.com/maps/dir/?api=1&destination=${fig.lat},${fig.lng}`;

      const marker = markers.find(m => m.fig.id === fig.id);
      if (marker) marker.el.classList.add('active');

      const card = document.querySelector(`.figure-card[data-id="${fig.id}"]`);
      if (card) card.classList.add('active');

      map.flyTo({ center: [fig.lng, fig.lat], zoom: 15, speed: 0.8, curve: 1.2 });
    }

    function buildFigureList() {
      const container = document.getElementById('figure-list');
      container.innerHTML = '';
      figures.forEach(fig => {
        const card = document.createElement('div');
        card.className = 'figure-card';
        card.dataset.id = fig.id;
        card.innerHTML = `<div class="fc-name">${escapeHtml(fig.name)}</div><div class="fc-role">${escapeHtml(fig.role)}</div>`;
        card.addEventListener('click', () => selectFigure(fig));
        container.appendChild(card);
      });
    }

    function addMarkers() {
      figures.forEach(fig => {
        const el = document.createElement('div');
        el.className = 'figure-marker';

        const marker = new mapboxgl.Marker({ element: el })
          .setLngLat([fig.lng, fig.lat])
          .addTo(map);

        el.addEventListener('click', (e) => {
          e.stopPropagation();
          if (popupInstance) popupInstance.remove();
          popupInstance = new mapboxgl.Popup({ offset: 25, closeButton: true })
            .setLngLat([fig.lng, fig.lat])
            .setHTML(
              `<div class="popup-name">${escapeHtml(fig.name)}</div>` +
              `<div class="popup-role">${escapeHtml(fig.role)}</div>` +
              `<div class="popup-summary">${escapeHtml(fig.summary)}</div>`
            )
            .addTo(map);
          selectFigure(fig);
        });

        el.addEventListener('mouseenter', () => {
          if (selectedFigure && selectedFigure.id === fig.id) return;
          if (popupInstance) popupInstance.remove();
          popupInstance = new mapboxgl.Popup({ offset: 25, closeButton: false, closeOnClick: false })
            .setLngLat([fig.lng, fig.lat])
            .setHTML(`<div class="popup-name">${escapeHtml(fig.name)}</div><div class="popup-role">${escapeHtml(fig.role)}</div>`)
            .addTo(map);
        });

        el.addEventListener('mouseleave', () => {
          if (selectedFigure && selectedFigure.id === fig.id) return;
          if (popupInstance) { popupInstance.remove(); popupInstance = null; }
        });

        markers.push({ fig, marker, el });
      });
    }

    function resetMap() {
      if (popupInstance) { popupInstance.remove(); popupInstance = null; }
      selectFigure(null);
      map.flyTo({ center: INITIAL_CENTER, zoom: INITIAL_ZOOM, speed: 0.8 });
    }

    function startTour() {
      if (figures.length === 0) return;
      tourActive = true;
      tourStep = 0;
      document.getElementById('map-actions').style.display = 'none';
      document.getElementById('tour-controls').classList.add('visible');
      goToTourStop(0);
    }

    function goToTourStop(idx) {
      if (idx < 0 || idx >= figures.length) return;
      tourStep = idx;
      const fig = figures[tourStep];
      selectFigure(fig);
      document.getElementById('tour-step').textContent = `${tourStep + 1} / ${figures.length}`;
    }

    function exitTour() {
      tourActive = false;
      document.getElementById('map-actions').style.display = 'flex';
      document.getElementById('tour-controls').classList.remove('visible');
      resetMap();
    }

    map.on('load', () => {
      map.addControl(new mapboxgl.NavigationControl(), 'top-right');

      fetch(FIGURES_URL)
        .then(r => r.json())
        .then(data => {
          figures = data;
          buildFigureList();
          addMarkers();
        })
        .catch(err => console.error('Failed to load notable-figures.json', err));

      document.getElementById('detail-back').addEventListener('click', () => {
        selectFigure(null);
        if (!tourActive) map.flyTo({ center: INITIAL_CENTER, zoom: INITIAL_ZOOM, speed: 0.6 });
      });

      document.getElementById('reset-map').addEventListener('click', resetMap);
      document.getElementById('start-tour').addEventListener('click', startTour);
      document.getElementById('tour-next').addEventListener('click', () => {
        if (tourStep < figures.length - 1) goToTourStop(tourStep + 1);
      });
      document.getElementById('tour-prev').addEventListener('click', () => {
        if (tourStep > 0) goToTourStop(tourStep - 1);
      });
      document.getElementById('tour-exit').addEventListener('click', exitTour);
    });
  </script>
</body>
</html>
