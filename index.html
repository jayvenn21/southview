<script>
mapboxgl.accessToken = typeof MAPBOX_ACCESS_TOKEN !== 'undefined' ? MAPBOX_ACCESS_TOKEN : '';
const GRAVES_DATA_URL = 'data/graves.json';
const INITIAL_VIEW = { center: [-84.3731, 33.7019], zoom: 15.4, pitch: 0, bearing: 0 };

let graves = [];
let gravesWithCoords = [];
const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/streets-v12',
  center: INITIAL_VIEW.center,
  zoom: INITIAL_VIEW.zoom,

  bearing: INITIAL_VIEW.bearing
});
map.setMinZoom(14);
map.setMaxZoom(19);
const DISABLE_PINCH_ZOOM = false;
map.once('load', () => {
  map.jumpTo(INITIAL_VIEW);
  if (DISABLE_PINCH_ZOOM) {
    map.touchZoomRotate.disableRotation();
    map.touchZoomRotate.disable();
  }
});
function resetMapView() { map.easeTo(INITIAL_VIEW); }
map.on('error', (e) => {
  console.error('Mapbox error:', e);
  document.body.insertAdjacentHTML('afterbegin', '<div style="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#c00;color:#fff;padding:12px 24px;border-radius:8px;z-index:9999;font-size:14px;">Map failed to load. Check token & allow localhost at account.mapbox.com</div>');
});

let currentRandomIndex = 0;
let popupInstance = null;
let filteredGraves = [];
let tourActive = false;
let tourStep = 0;
let selectedGrave = null;
let selectedMarkerPulseInterval = null;
let hoveredGraveId = null;

/* ── Combobox helper ── */
function makeCombobox({ inputId, clearBtnId, dropdownId, wrapId, hiddenId, getOptions, onSelect }) {
  const input    = document.getElementById(inputId);
  const clearBtn = document.getElementById(clearBtnId);
  const dropdown = document.getElementById(dropdownId);
  const wrap     = document.getElementById(wrapId);
  const hidden   = document.getElementById(hiddenId);
  let activeIdx  = -1;
  let allOptions = [];

  function highlight(q, text) {
    if (!q) return escapeHtml(text);
    const idx = text.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return escapeHtml(text);
    return escapeHtml(text.slice(0, idx)) +
           '<em>' + escapeHtml(text.slice(idx, idx + q.length)) + '</em>' +
           escapeHtml(text.slice(idx + q.length));
  }

  function renderDropdown(q) {
    allOptions = getOptions();
    const q2 = q.trim().toLowerCase();
    const matches = q2
      ? allOptions.filter(o => o.toLowerCase().includes(q2))
      : allOptions;
    activeIdx = -1;
    dropdown.innerHTML = '';
    if (matches.length === 0) {
      dropdown.innerHTML = '<div class="combobox-no-results">No matches</div>';
    } else {
      matches.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'combobox-option';
        div.setAttribute('role', 'option');
        div.innerHTML = highlight(q2, opt);
        div.addEventListener('mousedown', (e) => {
          e.preventDefault();
          selectOption(opt);
        });
        dropdown.appendChild(div);
      });
    }
    dropdown.classList.add('open');
    input.setAttribute('aria-expanded', 'true');
  }

  function selectOption(val) {
    input.value = val;
    hidden.value = val;
    wrap.classList.add('has-value');
    dropdown.classList.remove('open');
    input.setAttribute('aria-expanded', 'false');
    activeIdx = -1;
    onSelect(val);
  }

  function clearSelection() {
    input.value = '';
    hidden.value = '';
    wrap.classList.remove('has-value');
    dropdown.classList.remove('open');
    input.setAttribute('aria-expanded', 'false');
    activeIdx = -1;
    onSelect('');
  }

  input.addEventListener('focus', () => renderDropdown(input.value));
  input.addEventListener('input', () => {
    if (input.value === '') {
      hidden.value = '';
      wrap.classList.remove('has-value');
      onSelect('');
    }
    renderDropdown(input.value);
  });
  input.addEventListener('blur', () => {
    setTimeout(() => {
      dropdown.classList.remove('open');
      input.setAttribute('aria-expanded', 'false');
      // If what's typed doesn't exactly match a known option, clear the hidden value
      allOptions = getOptions();
      if (!allOptions.includes(input.value)) {
        if (input.value !== '') { input.value = ''; hidden.value = ''; wrap.classList.remove('has-value'); onSelect(''); }
      }
    }, 150);
  });
  input.addEventListener('keydown', (e) => {
    const opts = dropdown.querySelectorAll('.combobox-option');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIdx = Math.min(activeIdx + 1, opts.length - 1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIdx = Math.max(activeIdx - 1, -1);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIdx >= 0 && opts[activeIdx]) {
        const text = opts[activeIdx].textContent;
        selectOption(text);
      }
      return;
    } else if (e.key === 'Escape') {
      dropdown.classList.remove('open');
      input.setAttribute('aria-expanded', 'false');
      return;
    }
    opts.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
    if (activeIdx >= 0 && opts[activeIdx]) opts[activeIdx].scrollIntoView({ block: 'nearest' });
  });
  clearBtn.addEventListener('click', clearSelection);

  // Expose a reset function
  return { reset: clearSelection, setValue: selectOption };
}

/* ─── Init comboboxes ─── */
let sectionCombo, funeralCombo;

function formatDate(str) {
  if (!str || str.length < 10) return null;
  const d = new Date(str + 'T12:00:00');
  if (isNaN(d.getTime())) return str.slice(0, 10);
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
}

function relatedScore(a, b) {
  let score = 0;
  const aLast = (a.lastName || '').trim().toLowerCase();
  const bLast = (b.lastName || '').trim().toLowerCase();
  if (aLast && bLast && aLast === bLast) score += 5;
  const aSection = a.locationString || '';
  const bSection = b.locationString || '';
  if (aSection && bSection && aSection === bSection) score += 3;
  const aLot = (a.lot != null && a.lot !== '') ? String(a.lot).trim() : '';
  const bLot = (b.lot != null && b.lot !== '') ? String(b.lot).trim() : '';
  if (aLot && bLot && aLot === bLot) score += 4;
  const aFuneral = a.funeralHome || '';
  const bFuneral = b.funeralHome || '';
  if (aFuneral && bFuneral && aFuneral === bFuneral) score += 1;
  const aYear = a.serviceYear != null ? a.serviceYear : (a.deathYear != null ? a.deathYear : null);
  const bYear = b.serviceYear != null ? b.serviceYear : (b.deathYear != null ? b.deathYear : null);
  if (aYear != null && bYear != null && Math.abs(aYear - bYear) <= 1) score += 1;
  return score;
}

function getRelated(grave, limit) {
  const withCoords = graves.filter(g => g.id !== grave.id && g.lat != null && g.lng != null);
  const scored = withCoords.map(g => ({ g, score: relatedScore(grave, g) })).filter(x => x.score > 0);
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, limit || 5).map(x => x.g);
}

function createPopupHTML(g) {
  const name = (g.fullName || [g.firstName, g.middleName, g.lastName].filter(Boolean).join(' ')).trim();
  const born = g.birthDate ? formatDate(g.birthDate) : null;
  const died = g.deathDate ? formatDate(g.deathDate) : null;
  const service = g.serviceDate ? formatDate(g.serviceDate) : null;
  const ageStr = g.age != null ? `Age: ${g.age}` : '';
  const parts = [];
  if (born) parts.push(`Born: ${escapeHtml(born)}`);
  if (died) parts.push(`Died: ${escapeHtml(died)}`);
  if (service) parts.push(`Service: ${escapeHtml(service)}`);
  if (ageStr) parts.push(ageStr);
  if (g.gender) parts.push(`Gender: ${escapeHtml(g.gender)}`);
  if (g.locationString) parts.push(`Section: ${escapeHtml(g.locationString)}`);
  if (g.funeralHome) parts.push(`Funeral home: ${escapeHtml(g.funeralHome)}`);
  if (g.graveType) parts.push(`Grave type: ${escapeHtml(g.graveType)}`);
  const metaHtml = parts.length ? `<div class="popup-meta">${parts.join('<br>')}</div>` : '';
  const related = getRelated(g, 4);
  let relatedHtml = '';
  if (related.length > 0) {
    relatedHtml = '<div class="popup-related"><strong>Related burials</strong><ul>' +
      related.map(r => `<li><a href="#" data-id="${r.id}" class="popup-related-link">${escapeHtml((r.fullName || (r.firstName + ' ' + (r.lastName || '')).trim()))}</a></li>`).join('') +
      '</ul></div>';
  }
  const tagsHtml = (g.tags && g.tags.length)
    ? `<div class="popup-tags">${g.tags.map(t => `<span class="popup-tag">${escapeHtml(t)}</span>`).join(' ')}</div>` : '';
  return `<div class="popup-content">
    <div class="popup-title">${escapeHtml(name)}</div>
    ${metaHtml}${tagsHtml}${relatedHtml}
  </div>`;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function openPopupForGrave(grave) {
  if (popupInstance) popupInstance.remove();
  if (!grave || grave.lat == null || grave.lng == null) return;
  popupInstance = new mapboxgl.Popup({ offset: 25, closeButton: true })
    .setLngLat([grave.lng, grave.lat])
    .setHTML(createPopupHTML(grave))
    .addTo(map);
  map.flyTo({ center: [grave.lng, grave.lat], zoom: GRAVE_ZOOM_CLOSE, speed: 0.5, curve: 1.2, essential: true });
  popupInstance.on('open', () => {
    const container = popupInstance.getElement();
    container.querySelectorAll('.popup-related-link').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const id = parseInt(a.dataset.id, 10);
        const g = graves.find(x => x.id === id);
        if (g) selectGrave(g);
      });
    });
  });
}

const GRAVE_ZOOM_CLOSE = 17.7;
const GRAVE_ZOOM_PAN = 16;

function updateSelectedMarker(grave) {
  if (selectedMarkerPulseInterval) { clearInterval(selectedMarkerPulseInterval); selectedMarkerPulseInterval = null; }
  if (!map.getSource) return;
  const src = map.getSource('selected-grave');
  if (!src) return;
  if (!grave || grave.lat == null || grave.lng == null) {
    src.setData({ type: 'FeatureCollection', features: [] });
    return;
  }
  src.setData({ type: 'Feature', properties: {}, geometry: { type: 'Point', coordinates: [grave.lng, grave.lat] } });
  if (map.getLayer('selected-grave-halo')) {
    let opacity = 0.35;
    selectedMarkerPulseInterval = setInterval(() => {
      opacity = opacity === 0.35 ? 0.6 : 0.35;
      try { map.setPaintProperty('selected-grave-halo', 'circle-opacity', opacity); } catch (_) {}
    }, 600);
  }
}

function flyToGrave(grave) {
  if (!grave || grave.lat == null || grave.lng == null) return;
  map.easeTo({ center: [grave.lng, grave.lat], zoom: GRAVE_ZOOM_PAN, duration: 800 });
  setTimeout(() => {
    map.easeTo({ center: [grave.lng, grave.lat], zoom: GRAVE_ZOOM_CLOSE, duration: 600 });
  }, 300);
}

function selectGrave(grave) {
  if (popupInstance) popupInstance.remove();
  setHoveredGrave(null);
  selectedGrave = grave;
  updateSelectedMarker(grave);
  const listWrap = document.getElementById('list-view-wrap');
  const detailPanel = document.getElementById('selected-burial');
  if (!grave) {
    listWrap.classList.remove('hidden');
    detailPanel.classList.remove('visible');
    return;
  }
  listWrap.classList.add('hidden');
  detailPanel.classList.add('visible');
  const name = (grave.fullName || [grave.firstName, grave.middleName, grave.lastName].filter(Boolean).join(' ')).trim();
  const born = grave.birthDate ? formatDate(grave.birthDate) : null;
  const died = grave.deathDate ? formatDate(grave.deathDate) : null;
  const service = grave.serviceDate ? formatDate(grave.serviceDate) : null;
  const metaLines = [];
  if (born) metaLines.push('<p><strong>Born:</strong> ' + escapeHtml(born) + '</p>');
  if (died) metaLines.push('<p><strong>Died:</strong> ' + escapeHtml(died) + '</p>');
  if (service) metaLines.push('<p><strong>Service:</strong> ' + escapeHtml(service) + '</p>');
  if (grave.age != null) metaLines.push('<p><strong>Age:</strong> ' + escapeHtml(String(grave.age)) + '</p>');
  if (grave.gender) {
    const gNorm = normalizeGender(grave.gender);
    const gLabel = GENDER_OPTIONS.find(o => o.value === gNorm);
    metaLines.push('<p><strong>Gender:</strong> ' + escapeHtml(gLabel ? gLabel.label : grave.gender) + '</p>');
  }
  if (grave.locationString) metaLines.push('<p><strong>Section:</strong> ' + escapeHtml(grave.locationString) + '</p>');
  if (grave.funeralHome) metaLines.push('<p><strong>Funeral home:</strong> ' + escapeHtml(grave.funeralHome) + '</p>');
  document.getElementById('detail-name').textContent = name;
  document.getElementById('detail-meta').innerHTML = metaLines.length ? metaLines.join('') : '';
  const bioEl = document.getElementById('detail-bio');
  if (grave.tourTag) {
    bioEl.textContent = 'This burial is part of the ' + grave.tourTag + ' tour.';
    bioEl.style.display = '';
  } else {
    bioEl.textContent = '';
    bioEl.style.display = 'none';
  }
  const related = getRelated(grave, 5);
  const relatedEl = document.getElementById('detail-related');
  if (related.length > 0) {
    relatedEl.innerHTML = '<h4>Related burials</h4><ul>' +
      related.map(r => {
        const rName = (r.fullName || [r.firstName, r.lastName].filter(Boolean).join(' ')).trim();
        return `<li><a href="#" data-id="${r.id}" class="detail-related-link">${escapeHtml(rName)}</a></li>`;
      }).join('') + '</ul>';
    relatedEl.querySelectorAll('.detail-related-link').forEach(a => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const g = graves.find(x => x.id === parseInt(a.dataset.id, 10));
        if (g) selectGrave(g);
        if (g && g.lat != null && g.lng != null) flyToGrave(g);
      });
    });
  } else {
    relatedEl.innerHTML = '';
  }
  const directionsEl = document.getElementById('get-directions-link');
  if (grave.lat != null && grave.lng != null) {
    flyToGrave(grave);
    directionsEl.href = 'https://www.google.com/maps/dir/?api=1&destination=' + grave.lat + ',' + grave.lng;
    directionsEl.style.display = 'inline-block';
  } else {
    directionsEl.style.display = 'none';
  }
}

function getFilteredGraves() {
  const nameQuery = document.getElementById('search-name').value.trim().toLowerCase();
  const gender    = document.getElementById('filter-gender').value;
  const section   = document.getElementById('filter-section').value;
  const funeral   = document.getElementById('filter-funeral').value;
  const graveType = document.getElementById('filter-grave-type').value;
  const birthYearFrom = (() => { const v = document.getElementById('filter-birth-year-from').value.trim(); const n = parseInt(v, 10); return v && !isNaN(n) && n >= 1000 && n <= 2100 ? n : null; })();
  const birthYearTo   = (() => { const v = document.getElementById('filter-birth-year-to').value.trim();   const n = parseInt(v, 10); return v && !isNaN(n) && n >= 1000 && n <= 2100 ? n : null; })();

  return graves.filter(g => {
    if (nameQuery) {
      const full  = (g.fullName || '').toLowerCase();
      const first = (g.firstName || '').toLowerCase();
      const last  = (g.lastName || '').toLowerCase();
      if (!full.includes(nameQuery) && !first.includes(nameQuery) && !last.includes(nameQuery)) return false;
    }
    if (gender    && normalizeGender(g.gender) !== gender) return false;
    if (section   && (g.locationString || '') !== section) return false;
    if (funeral   && (g.funeralHome || '') !== funeral)    return false;
    if (graveType && (g.graveType || '') !== graveType)    return false;
    if (birthYearFrom != null && (g.birthYear == null || g.birthYear < birthYearFrom)) return false;
    if (birthYearTo   != null && (g.birthYear == null || g.birthYear > birthYearTo))   return false;
    return true;
  });
}

function applyFilters() {
  filteredGraves = getFilteredGraves();
  updateListPanel();
  if (map.getSource && map.getSource('graves')) {
    const withCoords = filteredGraves.filter(g => g.lat != null && g.lng != null);
    map.getSource('graves').setData({
      type: 'FeatureCollection',
      features: withCoords.map(g => ({
        type: 'Feature',
        geometry: { type: 'Point', coordinates: [g.lng, g.lat] },
        properties: { id: g.id }
      }))
    });
  }
  if (tourActive && filteredGravesWithCoords().length > 0) {
    tourStep = Math.min(tourStep, filteredGravesWithCoords().length - 1);
    updateTourPath();
  }
}

function filteredGravesWithCoords() {
  return filteredGraves.filter(g => g.lat != null && g.lng != null);
}

function setHoveredGrave(grave) {
  hoveredGraveId = grave ? grave.id : null;
  document.querySelectorAll('.list-panel-item[data-grave-id]').forEach(el => {
    el.classList.toggle('hovered', parseInt(el.dataset.graveId, 10) === hoveredGraveId);
  });
  if (!map.getSource || !map.getSource('graves-hover')) return;
  const showHover = grave && grave.lat != null && grave.lng != null && (!selectedGrave || selectedGrave.id !== grave.id);
  if (showHover) {
    map.getSource('graves-hover').setData({
      type: 'FeatureCollection',
      features: [{ type: 'Feature', geometry: { type: 'Point', coordinates: [grave.lng, grave.lat] }, properties: {} }]
    });
    map.setLayoutProperty('graves-hover-layer', 'visibility', 'visible');
  } else {
    map.getSource('graves-hover').setData({ type: 'FeatureCollection', features: [] });
    map.setLayoutProperty('graves-hover-layer', 'visibility', 'none');
  }
}

function updateListPanel() {
  const listEl = document.getElementById('list-panel-list');
  listEl.innerHTML = '';
  filteredGraves.slice(0, 200).forEach(g => {
    const name = (g.fullName || [g.firstName, g.middleName, g.lastName].filter(Boolean).join(' ')).trim();
    const sub  = [g.locationString, g.deathDate ? g.deathDate.slice(0, 4) : ''].filter(Boolean).join(' · ');
    const div  = document.createElement('div');
    div.className  = 'list-panel-item';
    div.dataset.graveId = g.id;
    div.innerHTML  = `<strong>${escapeHtml(name)}</strong>${sub ? `<span>${escapeHtml(sub)}</span>` : ''}`;
    div.addEventListener('click', () => { selectGrave(g); if (g.lat != null && g.lng != null) flyToGrave(g); });
    div.addEventListener('mouseenter', () => {
      if (g.lat != null && g.lng != null) {
        map.flyTo({ center: [g.lng, g.lat], zoom: GRAVE_ZOOM_CLOSE, speed: 0.5, curve: 1.2, essential: true });
        setHoveredGrave(g);
      }
    });
    div.addEventListener('mouseleave', () => { setHoveredGrave(null); });
    listEl.appendChild(div);
  });
  if (filteredGraves.length > 200) {
    const more = document.createElement('div');
    more.className = 'list-panel-item';
    more.style.fontStyle = 'italic';
    more.textContent = `+ ${filteredGraves.length - 200} more. Use filters to narrow.`;
    listEl.appendChild(more);
  }
}

function getTourPathCoords() { return filteredGravesWithCoords().slice(0, 20).map(g => [g.lng, g.lat]); }
function getProgressPathCoords() {
  if (tourStep <= 0) return [];
  return getTourPathCoords().slice(0, tourStep + 1);
}
function getTourCalloutContent(step) {
  const arr = filteredGravesWithCoords();
  if (arr.length === 0) return '';
  const maxStops = Math.min(20, arr.length);
  if (step === 0) return 'Explorer Mode — interactive walkthrough of the cemetery.';
  if (step === maxStops - 1) return "Final stop. You've completed the interactive cemetery walkthrough.";
  const g = arr[step];
  return (g.fullName || [g.firstName, g.lastName].filter(Boolean).join(' ')).trim();
}

function updateTourPath() {
  if (!map.getSource || !map.getSource('tour-path-full')) return;
  const fullCoords = getTourPathCoords();
  const progressCoords = getProgressPathCoords();
  map.getSource('tour-path-full').setData({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: fullCoords } });
  map.getSource('tour-path-progress').setData({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: progressCoords } });
  const total = filteredGravesWithCoords().length;
  const maxStops = Math.min(20, total);
  const current = total > 0 ? Math.min(tourStep + 1, maxStops) : 0;
  document.getElementById('tour-step').textContent = total > 0 ? `Stop ${current} of ${maxStops} — Explorer Mode` : '0 / 0';
  const fillEl = document.getElementById('tour-progress-fill');
  if (fillEl) fillEl.style.width = maxStops > 0 ? (current / maxStops * 100) + '%' : '0%';
}

function showTourCallout(text) {
  const el = document.getElementById('tour-callout');
  document.getElementById('tour-callout-text').textContent = text;
  el.classList.remove('hidden');
}
function hideTourCallout() { document.getElementById('tour-callout').classList.add('hidden'); }

function goToTourStop(step) {
  const arr = filteredGravesWithCoords();
  if (arr.length === 0) return;
  const maxStep = Math.min(20, arr.length) - 1;
  tourStep = Math.max(0, Math.min(step, maxStep));
  const g = arr[tourStep];
  updateTourPath();
  selectGrave(g);
  showTourCallout(getTourCalloutContent(tourStep));
  document.getElementById('tour-prev').disabled = tourStep === 0;
}

function exitTour() {
  tourActive = false;
  document.getElementById('map-actions').style.display = 'flex';
  document.getElementById('tour-controls').classList.remove('visible');
  hideTourCallout();
  map.setLayoutProperty('tour-path-full', 'visibility', 'none');
  map.setLayoutProperty('tour-path-progress', 'visibility', 'none');
  if (popupInstance) popupInstance.remove();
}

function startTour() {
  if (filteredGravesWithCoords().length === 0) return;
  tourActive = true;
  tourStep = 0;
  document.getElementById('map-actions').style.display = 'none';
  document.getElementById('tour-controls').classList.add('visible');
  map.setLayoutProperty('tour-path-full', 'visibility', 'visible');
  map.setLayoutProperty('tour-path-progress', 'visibility', 'visible');
  goToTourStop(0);
}

const GENDER_OPTIONS = [
  { value: 'M', label: 'Male' },
  { value: 'F', label: 'Female' },
  { value: 'N', label: 'Not Specified' },
  { value: 'U', label: 'Unknown' }
];

function normalizeGender(val) {
  if (!val) return '';
  const v = String(val).trim().toUpperCase();
  if (v === 'M' || v === 'MALE') return 'M';
  if (v === 'F' || v === 'FEMALE') return 'F';
  if (v === 'N' || v === 'NON-BINARY' || v === 'NONBINARY' || v === 'NOT SPECIFIED') return 'N';
  if (v === 'U' || v === 'UNKNOWN' || v === 'OTHER') return 'U';
  return v;
}

function populateFilterOptions() {
  const sections    = [...new Set(graves.map(g => g.locationString).filter(Boolean))].sort().slice(0, 100);
  const funerals    = [...new Set(graves.map(g => g.funeralHome).filter(Boolean))].sort().slice(0, 80);
  const graveTypes  = [...new Set(graves.map(g => g.graveType).filter(Boolean))].sort().slice(0, 50);
  const years       = [...new Set(graves.map(g => g.birthYear).filter(Boolean))].filter(y => y >= 1850 && y <= 2030).sort((a, b) => a - b);

  const genderSel = document.getElementById('filter-gender');
  genderSel.innerHTML = '<option value="">All</option>' +
    GENDER_OPTIONS.map(o => `<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`).join('');

  // grave type stays as a <select>
  const graveTypeSel = document.getElementById('filter-grave-type');
  graveTypeSel.innerHTML = '<option value="">All</option>' +
    graveTypes.map(o => `<option value="${escapeHtml(String(o))}">${escapeHtml(String(o))}</option>`).join('');

  // Year inputs are plain text — no population needed

  // Wire up comboboxes now that data is loaded
  sectionCombo = makeCombobox({
    inputId:   'filter-section-input',
    clearBtnId:'section-combobox-clear',
    dropdownId:'section-dropdown',
    wrapId:    'section-combobox-wrap',
    hiddenId:  'filter-section',
    getOptions: () => [...new Set(graves.map(g => g.locationString).filter(Boolean))].sort(),
    onSelect:  () => applyFilters()
  });

  funeralCombo = makeCombobox({
    inputId:   'filter-funeral-input',
    clearBtnId:'funeral-combobox-clear',
    dropdownId:'funeral-dropdown',
    wrapId:    'funeral-combobox-wrap',
    hiddenId:  'filter-funeral',
    getOptions: () => [...new Set(graves.map(g => g.funeralHome).filter(Boolean))].sort(),
    onSelect:  () => applyFilters()
  });
}

map.on('load', () => {
  map.addControl(new mapboxgl.NavigationControl(), 'top-right');
  map.resize();
  window.addEventListener('resize', () => map.resize());

  fetch(GRAVES_DATA_URL)
    .then(r => r.json())
    .then(data => {
      graves = data;
      gravesWithCoords = graves.filter(g => g.lat != null && g.lng != null);
      const geojson = {
        type: 'FeatureCollection',
        features: gravesWithCoords.map(g => ({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [g.lng, g.lat] },
          properties: { id: g.id }
        }))
      };
      map.addSource('graves', { type: 'geojson', data: geojson, cluster: true, clusterMaxZoom: 16, clusterRadius: 50 });
      map.addLayer({ id: 'graves-clusters', type: 'circle', source: 'graves', filter: ['has', 'point_count'],
        paint: { 'circle-color': '#5c4a32', 'circle-radius': ['step', ['get', 'point_count'], 20, 100, 30, 750, 40], 'circle-stroke-width': 2, 'circle-stroke-color': '#e8dfd0' } });
      map.addLayer({ id: 'graves-cluster-count', type: 'symbol', source: 'graves', filter: ['has', 'point_count'],
        layout: { 'text-field': ['get', 'point_count_abbreviated'], 'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'], 'text-size': 12 },
        paint: { 'text-color': '#f5f0e8' } });
      map.addLayer({ id: 'graves-unclustered', type: 'circle', source: 'graves', filter: ['!', ['has', 'point_count']],
        paint: { 'circle-color': '#5c4a32', 'circle-radius': 6, 'circle-stroke-width': 2, 'circle-stroke-color': '#e8dfd0' } });

      map.addSource('graves-hover', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({ id: 'graves-hover-layer', type: 'circle', source: 'graves-hover',
        paint: { 'circle-color': '#C19A6B', 'circle-radius': 14, 'circle-stroke-width': 2, 'circle-stroke-color': '#ffffff' } });

      map.addSource('selected-grave', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({ id: 'selected-grave-halo', type: 'circle', source: 'selected-grave',
        paint: { 'circle-color': '#ffffff', 'circle-radius': 28, 'circle-opacity': 0.4, 'circle-blur': 0.6 } });
      map.addLayer({ id: 'selected-grave-marker', type: 'circle', source: 'selected-grave',
        paint: { 'circle-color': '#C19A6B', 'circle-radius': 20, 'circle-stroke-width': 4, 'circle-stroke-color': '#ffffff' } });

      map.on('click', 'graves-clusters', (e) => {
        const features = map.queryRenderedFeatures(e.point, { layers: ['graves-clusters'] });
        if (!features.length) return;
        const clusterId = features[0].properties.cluster_id;
        map.getSource('graves').getClusterExpansionZoom(clusterId, (err, zoom) => {
          if (err) return;
          map.easeTo({ center: features[0].geometry.coordinates, zoom: zoom });
        });
      });
      map.on('click', 'graves-unclustered', (e) => {
        const features = map.queryRenderedFeatures(e.point, { layers: ['graves-unclustered'] });
        if (!features.length) return;
        const id = features[0].properties.id;
        const g = graves.find(x => x.id === id);
        if (g) selectGrave(g);
      });
      map.on('mouseenter', 'graves-unclustered', (e) => {
        map.getCanvas().style.cursor = 'pointer';
        const features = map.queryRenderedFeatures(e.point, { layers: ['graves-unclustered'] });
        if (features.length) { const g = graves.find(x => x.id === features[0].properties.id); if (g) setHoveredGrave(g); }
      });
      map.on('mouseleave', 'graves-unclustered', () => { map.getCanvas().style.cursor = ''; setHoveredGrave(null); });
      map.on('mouseenter', 'graves-clusters', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'graves-clusters', () => { map.getCanvas().style.cursor = ''; });

      filteredGraves = graves;
      populateFilterOptions();
      applyFilters();
      updateListPanel();
    })
    .catch(err => {
      console.error('Failed to load graves.json', err);
      document.body.insertAdjacentHTML('afterbegin', '<div style="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#c00;color:#fff;padding:12px 24px;border-radius:8px;z-index:9999;">Failed to load data/graves.json. Run convert.py and serve from localhost.</div>');
    });

  map.addSource('tour-path-full', { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [INITIAL_VIEW.center] } } });
  map.addSource('tour-path-progress', { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [] } } });
  map.addLayer({ id: 'tour-path-full', type: 'line', source: 'tour-path-full',
    layout: { 'line-join': 'round', 'line-cap': 'round', visibility: 'none' },
    paint: { 'line-color': '#94a3b8', 'line-width': 4, 'line-dasharray': [2, 2], 'line-opacity': 0.7 } });
  map.addLayer({ id: 'tour-path-progress', type: 'line', source: 'tour-path-progress',
    layout: { 'line-join': 'round', 'line-cap': 'round', visibility: 'none' },
    paint: { 'line-color': '#722f37', 'line-width': 5 } });

  document.getElementById('search-name').addEventListener('input', applyFilters);
  document.getElementById('filter-gender').addEventListener('change', applyFilters);
  document.getElementById('filter-grave-type').addEventListener('change', applyFilters);
  function validateYearInput(el) {
    const v = el.value.trim();
    if (v === '') { el.classList.remove('invalid'); return; }
    const n = parseInt(v, 10);
    const ok = /^\d{4}$/.test(v) && n >= 1000 && n <= 2100;
    el.classList.toggle('invalid', !ok);
  }

  ['filter-birth-year-from', 'filter-birth-year-to'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', () => {
      // Only allow digits
      el.value = el.value.replace(/\D/g, '');
      validateYearInput(el);
      if (!el.classList.contains('invalid')) applyFilters();
      if (el.value === '') applyFilters();
    });
    el.addEventListener('blur', () => {
      validateYearInput(el);
      applyFilters();
    });
  });

  function doClearFilters() {
    document.getElementById('search-name').value = '';
    document.getElementById('filter-gender').value = '';
    document.getElementById('filter-grave-type').value = '';
    document.getElementById('filter-birth-year-from').value = '';
    document.getElementById('filter-birth-year-from').classList.remove('invalid');
    document.getElementById('filter-birth-year-to').value = '';
    document.getElementById('filter-birth-year-to').classList.remove('invalid');
    if (sectionCombo) sectionCombo.reset();
    if (funeralCombo) funeralCombo.reset();
    selectGrave(null);
    applyFilters();
  }

  document.getElementById('clear-filters').addEventListener('click', doClearFilters);
  document.getElementById('clear-filters-inside').addEventListener('click', () => {
    doClearFilters();
    document.getElementById('more-filters').classList.remove('open');
    document.getElementById('filter-links-row-top').style.display = 'flex';
  });

  function toggleMoreFilters() {
    const moreFiltersEl = document.getElementById('more-filters');
    const topRowEl = document.getElementById('filter-links-row-top');
    moreFiltersEl.classList.toggle('open');
    const isOpen = moreFiltersEl.classList.contains('open');
    topRowEl.style.display = isOpen ? 'none' : 'flex';
  }
  document.getElementById('more-filters-toggle').addEventListener('click', toggleMoreFilters);
  document.getElementById('less-filters-toggle').addEventListener('click', toggleMoreFilters);
  document.getElementById('back-to-list').addEventListener('click', () => { selectGrave(null); });
  document.getElementById('reset-map').addEventListener('click', resetMapView);
  document.getElementById('start-tour').addEventListener('click', startTour);
  document.getElementById('tour-next').addEventListener('click', () => {
    const arr = filteredGravesWithCoords();
    if (arr.length === 0) return;
    const maxStep = Math.min(20, arr.length);
    const next = (tourStep + 1) % maxStep;
    goToTourStop(next);
  });
  document.getElementById('tour-prev').addEventListener('click', () => goToTourStop(tourStep - 1));
  document.getElementById('tour-exit').addEventListener('click', exitTour);
});
</script>
</body>
</html>
