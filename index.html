<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>South View — Historic Cemetery Navigation & History</title>
  <link rel="icon" href="assets/cemelogo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="assets/cemelogo.png" alt="South View Cemetery" class="site-logo">
        <p class="sidebar-tagline">Atlanta, Remembered Still.</p>
      </div>
      <div class="sidebar-body">
        <div class="list-view-wrap" id="list-view-wrap">
          <div class="list-panel-title">Burials</div>
          <div class="list-panel-list" id="list-panel-list"></div>
        </div>
        <div class="selected-burial" id="selected-burial">
          <button type="button" class="back-to-list" id="back-to-list">← Back to list</button>
          <div class="detail-name" id="detail-name"></div>
          <div class="detail-photo-wrap" id="detail-photo-wrap" style="display:none;">
            <div class="detail-photo-frame">
              <img class="detail-photo" id="detail-photo" alt="" width="168" height="168" hidden>
              <div id="detail-photo-placeholder" class="detail-photo-placeholder" aria-hidden="true"></div>
            </div>
          </div>
          <div class="detail-meta" id="detail-meta"></div>
          <div class="detail-bio" id="detail-bio"></div>
          <div class="detail-history" id="detail-history" style="display:none;"></div>
          <a id="get-directions-link" href="#" target="_blank" rel="noopener" class="get-directions-link" style="display:none;">Get Directions</a>
        </div>
      </div>
      <div
        class="sidebar-resize-handle"
        id="sidebar-resize-handle"
        role="separator"
        aria-orientation="horizontal"
        aria-label="Drag to resize burial list panel"
        title="Drag to resize panel"
      ></div>
    </aside>
    <div class="map-wrap">
      <div id="map"></div>
      <div id="tour-callout" class="tour-callout hidden">
        <div class="tour-callout-inner">
          <div class="tour-callout-main">
            <span class="tour-callout-icon" aria-hidden="true">·</span>
            <span id="tour-callout-text"></span>
          </div>
          <div class="tour-callout-progress-bar" aria-hidden="true">
            <div class="tour-progress-fill" id="tour-progress-fill" style="width:0%"></div>
          </div>
          <div id="tour-callout-progress" class="tour-callout-progress" aria-live="polite"></div>
        </div>
      </div>
      <div id="waypoint-hover-callout" class="waypoint-hover-callout hidden" role="tooltip" aria-hidden="true">
        <img class="waypoint-hover-callout-bg" src="assets/box_info.png" alt="" decoding="async">
        <div class="waypoint-hover-callout-inner">
          <div class="waypoint-hover-callout-photo-wrap">
            <img id="waypoint-hover-callout-photo" class="waypoint-hover-callout-photo" alt="" width="72" height="72" hidden>
            <div id="waypoint-hover-callout-photo-ph" class="waypoint-hover-callout-photo-placeholder" aria-hidden="true"></div>
          </div>
          <div class="waypoint-hover-callout-name" id="waypoint-hover-callout-name"></div>
        </div>
      </div>
      <div class="map-actions" id="map-actions">
        <button type="button" class="btn-reset" id="reset-map">Reset map</button>
        <button type="button" class="btn-tour" id="start-tour">Start Explorer Mode</button>
      </div>
      <div class="tour-controls" id="tour-controls">
        <div class="tour-nav-row">
          <button type="button" id="tour-prev">← Prev</button>
          <button type="button" id="tour-next">Next →</button>
          <button type="button" id="tour-exit">Exit Explorer</button>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
